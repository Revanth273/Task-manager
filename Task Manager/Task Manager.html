<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management App</title>
    <style>
        /* Step 1: Basic Reset and Typography */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #353e65 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
        }

        /* Step 2: Container Styling */
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 30px;
            backdrop-filter: blur(10px);
        }

        /* Step 3: Header Styling */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: #666;
            font-size: 1.1rem;
        }

        /* Step 4: Task Input Form Styling */
        .task-form {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 2px solid #e9ecef;
            transition: all 0.3s ease;
        }

        .task-form:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* Step 5: Button Styling */
        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
            margin: 0 2px;
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b, #ee5a52);
        }

        .btn-success {
            background: linear-gradient(135deg, #51cf66, #40c057);
        }

        /* Step 6: Filter and Stats Styling */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .filter-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .stats {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            padding: 15px 20px;
            border-radius: 8px;
            font-weight: 600;
            color: #495057;
        }

        /* Step 7: Task List Styling */
        .task-list {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        .task-item {
            padding: 20px;
            border-bottom: 1px solid #f0f0f0;
            transition: all 0.3s ease;
            position: relative;
        }

        .task-item:hover {
            background: #f8f9fa;
            transform: translateX(5px);
        }

        .task-item.completed {
            background: #f8fff8;
            opacity: 0.8;
        }

        .task-item.completed .task-title {
            text-decoration: line-through;
            color: #6c757d;
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .task-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #333;
            margin: 0;
        }

        .task-priority {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .priority-high { background: #ffe8e8; color: #d63384; }
        .priority-medium { background: #fff3cd; color: #f57c00; }
        .priority-low { background: #e8f5e8; color: #198754; }

        .task-description {
            color: #666;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .task-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: #888;
        }

        .task-date {
            font-weight: 500;
        }

        .task-actions {
            display: flex;
            gap: 5px;
        }

        /* Step 8: Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state h3 {
            margin-bottom: 15px;
            color: #333;
        }

        /* Step 9: Responsive Design */
        @media (max-width: 768px) {
            .container {
                margin: 10px;
                padding: 20px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .task-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .task-actions {
                align-self: flex-end;
            }
        }
    </style>
</head>
<body>
    <!-- Step 10: HTML Structure -->
    <div class="container">
        <!-- Header Section -->
        <div class="header">
            <h1>Task Manager</h1>
            <p>Organize your tasks efficiently</p>
        </div>

        <!-- Task Creation Form -->
        <div class="task-form">
            <div class="form-group">
                <label for="taskTitle">Task Title</label>
                <input type="text" id="taskTitle" placeholder="Enter task title">
            </div>
            
            <div class="form-group">
                <label for="taskDescription">Description</label>
                <textarea id="taskDescription" placeholder="Enter task description (optional)"></textarea>
            </div>

            <div class="form-group">
                <label for="taskPriority">Priority</label>
                <select id="taskPriority">
                    <option value="low">Low</option>
                    <option value="medium" selected>Medium</option>
                    <option value="high">High</option>
                </select>
            </div>

            <div class="form-group">
                <label for="taskDueDate">Due Date</label>
                <input type="date" id="taskDueDate">
            </div>

            <button class="btn" onclick="addTask()">Add Task</button>
        </div>

        <!-- Controls and Stats -->
        <div class="controls">
            <div class="filter-group">
                <select id="filterPriority" onchange="filterTasks()">
                    <option value="all">All Priorities</option>
                    <option value="high">High Priority</option>
                    <option value="medium">Medium Priority</option>
                    <option value="low">Low Priority</option>
                </select>
                
                <select id="filterStatus" onchange="filterTasks()">
                    <option value="all">All Tasks</option>
                    <option value="pending">Pending</option>
                    <option value="completed">Completed</option>
                </select>
            </div>
            
            <div class="stats" id="taskStats">
                0 tasks total
            </div>
        </div>

        <!-- Task List -->
        <div class="task-list" id="taskList">
            <div class="empty-state">
                <h3>No tasks yet</h3>
                <p>Add your first task to get started!</p>
            </div>
        </div>
    </div>

    <script>
        // Step 11: JavaScript - Task Management Logic
        let tasks = [];
        let nextId = 1;

        // Step 12: Add Task Function
        function addTask() {
            const title = document.getElementById('taskTitle').value.trim();
            const description = document.getElementById('taskDescription').value.trim();
            const priority = document.getElementById('taskPriority').value;
            const dueDate = document.getElementById('taskDueDate').value;

            // Validation
            if (!title) {
                alert('Please enter a task title');
                return;
            }

            // Create new task object
            const newTask = {
                id: nextId++,
                title: title,
                description: description,
                priority: priority,
                dueDate: dueDate,
                completed: false,
                createdAt: new Date().toLocaleDateString()
            };

            // Add to tasks array
            tasks.push(newTask);

            // Clear form
            clearForm();

            // Update display
            displayTasks();
            updateStats();
        }

        // Step 13: Clear Form Function
        function clearForm() {
            document.getElementById('taskTitle').value = '';
            document.getElementById('taskDescription').value = '';
            document.getElementById('taskPriority').value = 'medium';
            document.getElementById('taskDueDate').value = '';
        }

        // Step 14: Display Tasks Function
        function displayTasks() {
            const taskList = document.getElementById('taskList');
            const filterPriority = document.getElementById('filterPriority').value;
            const filterStatus = document.getElementById('filterStatus').value;

            // Filter tasks
            let filteredTasks = tasks.filter(task => {
                const priorityMatch = filterPriority === 'all' || task.priority === filterPriority;
                const statusMatch = filterStatus === 'all' || 
                    (filterStatus === 'completed' && task.completed) ||
                    (filterStatus === 'pending' && !task.completed);
                
                return priorityMatch && statusMatch;
            });

            // Sort tasks by priority and date
            filteredTasks.sort((a, b) => {
                const priorityOrder = { high: 3, medium: 2, low: 1 };
                if (priorityOrder[b.priority] !== priorityOrder[a.priority]) {
                    return priorityOrder[b.priority] - priorityOrder[a.priority];
                }
                return new Date(a.dueDate || '9999-12-31') - new Date(b.dueDate || '9999-12-31');
            });

            // Display tasks or empty state
            if (filteredTasks.length === 0) {
                taskList.innerHTML = `
                    <div class="empty-state">
                        <h3>No tasks found</h3>
                        <p>Try adjusting your filters or add a new task!</p>
                    </div>
                `;
                return;
            }

            // Generate task HTML
            taskList.innerHTML = filteredTasks.map(task => `
                <div class="task-item ${task.completed ? 'completed' : ''}">
                    <div class="task-header">
                        <h3 class="task-title">${task.title}</h3>
                        <span class="task-priority priority-${task.priority}">${task.priority}</span>
                    </div>
                    
                    ${task.description ? `<div class="task-description">${task.description}</div>` : ''}
                    
                    <div class="task-meta">
                        <div class="task-date">
                            Created: ${task.createdAt}
                            ${task.dueDate ? `| Due: ${new Date(task.dueDate).toLocaleDateString()}` : ''}
                        </div>
                        
                        <div class="task-actions">
                            <button class="btn btn-small btn-success" onclick="toggleTask(${task.id})">
                                ${task.completed ? '↶ Undo' : '✓ Done'}
                            </button>
                            <button class="btn btn-small btn-danger" onclick="deleteTask(${task.id})">
                                🗑 Delete
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Step 15: Toggle Task Completion
        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                displayTasks();
                updateStats();
            }
        }

        // Step 16: Delete Task Function
        function deleteTask(id) {
            if (confirm('Are you sure you want to delete this task?')) {
                tasks = tasks.filter(t => t.id !== id);
                displayTasks();
                updateStats();
            }
        }

        // Step 17: Filter Tasks Function
        function filterTasks() {
            displayTasks();
        }

        // Step 18: Update Statistics
        function updateStats() {
            const totalTasks = tasks.length;
            const completedTasks = tasks.filter(t => t.completed).length;
            const pendingTasks = totalTasks - completedTasks;
            
            document.getElementById('taskStats').textContent = 
                `${totalTasks} total, ${pendingTasks} pending, ${completedTasks} completed`;
        }

        // Step 19: Keyboard Shortcuts
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && e.ctrlKey) {
                addTask();
            }
        });

        // Step 20: Initialize App
        document.addEventListener('DOMContentLoaded', function() {
            // Set default due date to tomorrow
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            document.getElementById('taskDueDate').value = tomorrow.toISOString().split('T')[0];
            
            // Initial display
            displayTasks();
            updateStats();
        });
    </script>
</body>
</html>
